<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="ai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=iN4oY7OgknqM&format=png&color=000000" type="image/x-icon">

  <!-- Markdown parser (must load before ai.js uses it) -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <title>Jarvis</title>
</head>
<body>

  <!-- Shown until /api/me confirms the user is signed in; auth.js hides this
       and reveals #site once login succeeds -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="logo" style="width:48px;height:48px;font-size:18px;margin:0 auto 18px;">J</div>
      <h2>Sign in to Jarvis</h2>
      <p>Use your Google account to continue.</p>
      <button id="googleSignInBtn" type="button" class="google-btn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" width="18" height="18">
        Sign in with Google
      </button>
    </div>
  </div>

  <div id="site">

    <aside id="sidebar">
      <div class="brand">
        <div class="logo">J</div>
        <div class="title">Jarvis</div>
      </div>

      <div class="sidebar-label">Conversations</div>
      <button id="newChatBtn" type="button" class="new-chat-btn">+ New Chat</button>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-footer">
        <div class="mini-avatar" id="userAvatar">?</div>
        <div class="you" id="userInfo">Not signed in</div>
        <button id="authBtn" type="button" class="auth-btn">Sign in</button>
      </div>
    </aside>

    <div id="main">
      <header>
        <div class="header-left">
          <div class="avatar">J</div>
          <div class="header-text">
            <div class="name">Jarvis</div>
            <div class="status"><span class="dot"></span> Online</div>
          </div>
        </div>
      </header>

      <div id="chatbox">
        <h1 id="Welcome">Hello, how can I help you?</h1>
      </div>

      <form id="form_input">
        <input id="inputbox" placeholder="Anything is possible. Start typing..." autocomplete="off">
        <button id="button" class="btn btn-primary" type="submit">
          <img src="enter.png" alt="enter" height="20">
        </button>
      </form>
    </div>

  </div>

  <!-- auth.js must run before ai.js touches the chat, since it decides
       whether #site is even visible -->
  <script defer src="auth.js"></script>
  <script defer src="ai.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
